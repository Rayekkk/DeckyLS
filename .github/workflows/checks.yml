name: Quality checks

# Tests only. Releases are made by hand from a tag.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'  # oldest with tomllib
          - os: ubuntu-24.04
            python: '3.14'  # Decky Loader 3.3's interpreter
          - os: windows-2022
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run backend tests
        run: python -W error -m unittest discover -s tests -p "test_*.py" -v

  frontend-package:
    name: Frontend and package (Node.js 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check frontend types
        run: npm run typecheck
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Run frontend regression tests
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build
      - name: Build package (checks required files and that no lsfg-vk or Lossless Scaling file is inside)
        run: npm run package
